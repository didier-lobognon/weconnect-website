name: Build & Deploy

# Quand le workflow se lance : à chaque push sur main, ou à la main depuis l'onglet Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits du jeton GitHub fourni automatiquement : lire le code, écrire dans GHCR
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/didier-lobognon/weconnect-website

jobs:
  build:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
